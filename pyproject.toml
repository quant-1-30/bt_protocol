[tool.poetry]
name = "bt-protocol"
version = "0.2.6"
description = "revise core bug: relationship lazy=raise / selectin replace select"
authors = ["hengxin.liu <hengxin.liu@inceptio.ai>"]
readme = "README.md"
build = "build_ext.py"

include = [
    "bt_protocol/serialize/pb/*_pb2.py",
    "bt_protocol/serialize/pb/*_pb2_grpc.py",
    "bt_protocol/serialize/pb/*.pyi",
    { path = "bt_protocol/**/*.so", format = "wheel" },
    { path = "bt_protocol/**/*.pyx" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Must align with the version pinned by the generated grpc stub
# (bt_protocol_service_pb2_grpc.py enforces grpcio>=1.83.0 at import time).
grpcio = ">=1.83.0,<2.0"
sqlalchemy = "^2.0.47"
alembic = "^1.15.1"
asyncpg = "^0.31.0"
greenlet = "^3.5.1"
msgspec = "^0.18.6"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

#[tool.poetry.build]
#pre-build-script = "scripts/pre_build.py"  # 构建前运行
#post-build-script = "scripts/post_build.py" # 构建后运行

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["poetry-core", "wheel", "pybind11", "cmake", "Cython>=3.0", "numpy", "setuptools", "grpcio-tools"] # used to execute build.py
# build-backend =  "setuptools.build_meta" # 
build-backend = "poetry.core.masonry.api" # for pure python / scikit-build-core for cmake
