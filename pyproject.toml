[tool.poetry]
name = "bt-protocol"
version = "0.3.1"
description = "Protocol and ORM schema definitions for the quantitative backtest/trading stack"
authors = ["hengxin.liu <hengxin.liu@inceptio.ai>"]
readme = "README.md"
build = "build_ext.py"

include = [
    "bt_protocol/serialize/pb/*_pb2.py",
    "bt_protocol/serialize/pb/*_pb2_grpc.py",
    "bt_protocol/serialize/pb/*.pyi",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Must align with the versions required by the generated protobuf/grpc stubs
# (_pb2.py requires protobuf>=7.35.1,<8.0; _pb2_grpc.py enforces grpcio>=1.84.0 at import time).
grpcio = ">=1.84.0,<2.0"
protobuf = ">=7.35.1,<8.0"
sqlalchemy = "^2.0.47"
alembic = "^1.15.1"
asyncpg = "^0.31.0"
greenlet = "^3.5.1"
msgspec = "^0.18.6"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

#[tool.poetry.build]
#pre-build-script = "scripts/pre_build.py"  
#post-build-script = "scripts/post_build.py" 

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
grpcio-tools = ">=1.84.0,<2.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["poetry-core", "setuptools", "grpcio-tools>=1.84.0,<2.0"]
build-backend = "poetry.core.masonry.api"
